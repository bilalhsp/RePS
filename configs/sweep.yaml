program: scripts/sampling.py
method: bayes
metric:
  goal: maximize
  name: psnr_all

parameters:
  task.pixel.sampler_config.lr:
    distribution: log_uniform_values
    min: 1.e-6
    max: 1
  task.pixel.sampler_config.lam:
    distribution: log_uniform_values
    min: 1.e-3
    max: 10
  task.pixel.sampler_config.num_iters:
    distribution: int_uniform
    min: 1
    max: 20
  task.pixel.sampler_config.sigma_restart:
    distribution: uniform
    min: 2
    max: 80

command:
  - ${env}
  - python
  - ${program}
  - task=super_resolution
  - project_name=reps-sweep
  - data=demo-ffhq
  - model=ffhq
  - sampler=reps
  - num_runs=1
  - save_samples=False
  - eval_fid=False
  - batch_size=10
  - ${args_no_hyphens}